    minecraftLibrary("org.lwjgl:lwjgl-zstd:$lwjglVersion") { transitive = false }

    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux"
    minecraftLibrary("org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-windows") { transitive = false }
    minecraftLibrary("org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux")   { transitive = false }
    minecraftLibrary("org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows") { transitive = false }
    minecraftLibrary("org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux")   { transitive = false }

    shadowLibrary('org.rocksdb:rocksdbjni:10.2.1')
    minecraftLibrary('org.rocksdb:rocksdbjni:10.2.1') { transitive = false }

    shadowLibrary 'redis.clients:jedis:5.1.0'
    shadowLibrary 'io.github.resilience4j:resilience4j-circuitbreaker:2.1.0'
    shadowLibrary 'org.apache.commons:commons-pool2:2.12.0'
    shadowLibrary 'org.lz4:lz4-java:1.8.0'
    shadowLibrary('org.tukaani:xz:1.10')

    if (true) {
        if (!isInGHA) {
            runtimeOnly('org.xerial:sqlite-jdbc:3.49.1.0')
        }
    } else {
        shadowLibrary('org.xerial:sqlite-jdbc:3.49.1.0')
    }
}

shadowJar {
    archiveClassifier.set('')
    from sourceSets.main.output

    dependsOn(tasks.compileJava21)
    from(tasks.compileJava21.destinationDirectory) {
        into("META-INF/versions/21")
    }

    configurations = [project.configurations.shadowLibrary]

    mergeServiceFiles()

    manifest {
        attributes([
                "Multi-Release": "true",
                "MixinConfigs": "common.voxy.mixins.json,client.voxy.mixins.json"
        ])
    }

    relocate 'com.llamalad7.mixinextras', 'me.cortex.voxy.mixinextras'
    relocate 'org.anarres.cpp', 'me.cortex.voxy.shadow.jcpp'
    relocate 'io.github.douira.glsl', 'me.cortex.voxy.shadow.glsl'
    relocate 'redis.clients', 'me.cortex.voxy.shadow.redis'
    relocate 'org.apache.commons.pool2', 'me.cortex.voxy.shadow.commons.pool2'
    relocate 'net.jpountz', 'me.cortex.voxy.shadow.lz4'

    doFirst {
        delete fileTree(getDestinationDirectory().get())
    }

    if (!isInGHA) {
        def hash = gitCommitHash();
        if (!hash.equals("<UnknownCommit>")) {
            archiveClassifier.set(hash.substring(0,7));
        }
    }

    dependencies {
        include(dependency('org.rocksdb:rocksdbjni'))
        include(dependency('io.github.llamalad7:mixinextras-forge'))
        include(dependency('io.github.llamalad7:mixinextras-common'))
        include(dependency('org.lwjgl:lwjgl-zstd'))
        include(dependency('org.lwjgl:lwjgl-lmdb'))
        include(dependency('org.anarres:jcpp'))
        include(dependency('io.github.douira:glsl-transformer'))
        include(dependency('redis.clients:jedis'))
        include(dependency('io.github.resilience4j:resilience4j-circuitbreaker'))
        include(dependency('org.apache.commons:commons-pool2'))
        include(dependency('org.lz4:lz4-java'))
        include(dependency('org.tukaani:xz'))

        include(dependency('org.xerial:sqlite-jdbc'))
    }

    exclude { FileTreeElement details ->
        def name = details.path
        // Only target rocksdb files
        if (name.contains("rocksdb")) {
            if (name.endsWith(".jnilib")) {
                return true
            }
            if (name.endsWith(".so")) {
                // If it contains any of the forbidden archs, exclude it
                return ["osx", "linux32", "musl", "s390x", "riscv64", "ppc64le", "aarch64"].any { name.contains(it) }
            }
        }
        return false
    }

    zip64 true
}

reobf {
    shadowJar {}
}

jar.enabled = true
jar.archiveClassifier.set('raw')
assemble.dependsOn(tasks.reobfShadowJar)

